<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Elite Components</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        button, .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px 3px;
            font-size: 14px;
        }

        .remove { background: #dc3545; color: white; }
        .green { background: #198754; color: white; }
        .blue { background: #1769aa; color: white; }

        #total {
            background: #f1f1f1;
            padding: 15px;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Elite Components</h1>
    <p>More gig, Less Rand</p>
</header>

<div class="container">
    <h2>Your Shopping Cart</h2>

    <div id="cart-items"></div>

    <div id="total">
        Subtotal: R0.00<br>
        VAT (15%): R0.00<br>
        <strong>Total: R0.00</strong>
    </div>

    <button class="remove" onclick="clearCart()">Clear Cart</button>
    <a href="PcComponents.html" class="btn blue">Continue Shopping</a>
    <a href="Checkout.html" class="btn green">Proceed to Checkout</a>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function displayCart() {
        const cartDiv = document.getElementById("cart-items");
        let subtotal = 0;

        cartDiv.innerHTML = "";

        if (cart.length === 0) {
            cartDiv.textContent = "Your cart is empty.";
        } else {
            cart.forEach(function(item, index) {
                const price = Number(item.price) || 0;
                subtotal += price;

                const row = document.createElement("div");
                row.className = "cart-item";

                const details = document.createElement("span");
                details.textContent = item.name + " - R" + price.toFixed(2);

                const removeButton = document.createElement("button");
                removeButton.className = "remove";
                removeButton.textContent = "Remove";
                removeButton.onclick = function() {
                    removeItem(index);
                };

                row.appendChild(details);
                row.appendChild(removeButton);
                cartDiv.appendChild(row);
            });
        }

        const vat = subtotal * 0.15;
        const total = subtotal + vat;

        document.getElementById("total").innerHTML =
            "Subtotal: R" + subtotal.toFixed(2) +
            "<br>VAT (15%): R" + vat.toFixed(2) +
            "<br><strong>Total: R" + total.toFixed(2) + "</strong>";
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        displayCart();
    }

    function clearCart() {
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        displayCart();
    }

    displayCart();
</script>
<footer>
    <p>&copy; 2026 Elite Components. All rights reserved.</p>
    <p>More gig, Less Rand</p>
</footer>
</body>
</html>
